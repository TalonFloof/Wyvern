[binaries]
c       = 'riscv64-none-elf-gcc'
cpp     = 'riscv64-none-elf-g++'
ar      = 'riscv64-none-elf-ar'
strip   = 'riscv64-none-elf-strip'
objcopy = 'riscv64-none-elf-objcopy'
objdump = 'riscv64-none-elf-objdump'

[host_machine]
system     = 'none'
cpu_family = 'riscv64'
cpu        = 'riscv64'
endian     = 'little'
